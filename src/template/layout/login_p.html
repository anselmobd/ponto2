{% extends 'layout/index_p.html' %}
{% load static %}

{% block content %}
  <div>
    <h2>Identificação</h2>
    <form method="post">
      {% csrf_token %}
      <p>
        <label for="username">Usuário:</label>
        <input
          id="id_username"
          type="text"
          name="username"
          id="username"
          maxlength="150"
          autofocus=""
          placeholder="login"
          required=""
        >
      </p>
      <p>
        <label for="password">Senha:</label>
        <input
          id="id_password"
          type="password"
          name="password"
          id="password"
          placeholder="senha"
          required=""
        >
      </p>
      <button
        type="submit"
      >Enviar</button>
    </form>
  </div>
{% endblock %}
