{% load static %}<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="{% static 'favicon.ico' %}" type="image/x-icon">
  <title>Ponto2 . Bordado industrial - © 2023 RPR & Oxigenai</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- css -->
  <style type="text/tailwindcss">
    @layer utilities {
      .content-auto {
        content-visibility: auto;
      }
      .main-body {
        /* viewport height - footer height - nav/header height */
        min-height: calc(100vh - 1.5rem - 1px - 2rem - 1px );
      }
      .router-link:not(.router-link-active):hover {
        text-shadow: 1px 1px 2px  rgba(3, 132, 196, 0.7)
      }
    }
    @layer base {
      header > div > a {
        @apply text-black;
      }
      a {
        @apply text-blue-700;
      }
      button, .button {
        @apply mx-0.5 my-[1px] px-2 py-0.5 rounded-lg bg-sky-700 font-bold text-slate-100
      }
      input {
        @apply h-8 border mt-1 rounded px-1 bg-white
      }
    }
  </style>
</head>
<body>
  {% block header %}{% endblock %}

  <main class="main-body px-4">
    {% block content %}{% endblock %}
  </main>

  {% include 'layout/footer_tw.html' %}

  {% block javascript %}{% endblock %}
</body>
</html>
